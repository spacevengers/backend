services:
  api:
    build: .
    container_name: space-backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/firms.db
      EXPORT_DIR: /app/exports
      AUTO_MIGRATE: "true"
      API_ADDR: ":9999"
      TZ: UTC
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100,http://localhost:5173}
    ports:
      - "9999:9999"
    volumes:
      - firms-data:/app/data
      - firms-exports:/app/exports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  firms-data:
  firms-exports:
